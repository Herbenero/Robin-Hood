<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Robin Hood Darts</title>
  <!-- Keep your existing <style> tag content here -->
</head>
<body>

  <!-- Keep your existing HTML markup (main, sections, forms, tables, overlays) here -->

  <!-- 1. Firebase SDKs (Compatibility Build) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <!-- 2. Application Logic with Realtime Sync -->
  <script>
    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyAZWDcVew9u-4wf-KH3JpNZlHK1IbL3hXw",
      authDomain: "robinhoodmulti.firebaseapp.com",
      projectId: "robinhoodmulti",
      storageBucket: "robinhoodmulti.firebasestorage.app",
      messagingSenderId: "515075611331",
      appId: "1:515075611331:web:93d8a56a449f6256f16076",
      databaseURL: "https://robinhoodmulti-default-rtdb.firebaseio.com"
    };

    // Initialize Firebase & Database Reference
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const matchRef = database.ref('robinhood/currentMatch');

    // Local Game State
    const state = {
      players: [],
      started: false,
      currentPlayerIndex: 0,
      currentRound: 1,
      currentTurnThrows: [],
      history: [],
      gameOver: false,
      boardType: 'basic'
    };

    // Realtime Listener: Synchronize UI across all devices on database change
    matchRef.on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        Object.assign(state, data);
        renderPlayers();
        renderScoreboard();
        renderRanking();
        updateStatus();
      }
    });

    // Function to push local state changes to Firebase
    function syncGameState() {
      matchRef.set({
        players: state.players,
        started: state.started,
        currentPlayerIndex: state.currentPlayerIndex,
        currentRound: state.currentRound,
        currentTurnThrows: state.currentTurnThrows || [],
        history: state.history || [],
        gameOver: state.gameOver,
        boardType: state.boardType
      });
    }

    // DOM Elements
    const els = {
      playerName: document.getElementById('playerName'),
      boardTypeSelect: document.getElementById('boardTypeSelect'),
      addPlayerBtn: document.getElementById('addPlayerBtn'),
      startGameBtn: document.getElementById('startGameBtn'),
      resetGameBtn: document.getElementById('resetGameBtn')
      // Ensure all your other DOM element references are included here...
    };

    // Add Player Function (Syncs to DB)
    function addPlayer() {
      const name = els.playerName.value.trim();
      if (!name) return;
      if (state.players.some(p => p.name.toLowerCase() === name.toLowerCase())) {
        alert('Player already exists.');
        return;
      }
      state.players.push({
        name,
        totalScore: 0,
        roundScores: Array(6).fill(0),
        turnScores: Array(6).fill(null).map(() => [])
      });
      els.playerName.value = '';
      syncGameState();
    }

    // Start Game Function (Syncs to DB)
    function startGame() {
      if (state.players.length === 0) {
        alert('Add at least one player.');
        return;
      }
      state.started = true;
      state.boardType = els.boardTypeSelect ? els.boardTypeSelect.value : 'basic';
      syncGameState();
    }

    // Reset Game Function (Syncs to DB)
    function resetGame() {
      state.players = [];
      state.started = false;
      state.currentPlayerIndex = 0;
      state.currentRound = 1;
      state.currentTurnThrows = [];
      state.history = [];
      state.gameOver = false;
      syncGameState();
    }

    // Attach Event Listeners
    if (els.addPlayerBtn) els.addPlayerBtn.addEventListener('click', addPlayer);
    if (els.startGameBtn) els.startGameBtn.addEventListener('click', startGame);
    if (els.resetGameBtn) els.resetGameBtn.addEventListener('click', resetGame);

    // Call syncGameState() inside any action functions (recordThrow, nextTurn, undo, etc.)
  </script>
</body>
</html>
